# Mount the top-level config.toml into the containers. The long bind syntax
# with create_host_path=false makes Compose fail loudly if the file is missing
# instead of auto-creating a root-owned directory on the host.
x-config-mount: &config-mount
  type: bind
  source: ./config.toml
  target: /etc/songhive/config.toml
  read_only: true
  bind:
    create_host_path: false

# Inject .env into the Songhive containers as well as using it for Compose
# variable interpolation, so secrets (SONGHIVE_AUTH__SECRET_KEY, SMTP/VAPID
# keys, ...) and SONGHIVE_* overrides defined there reach the services.
x-env-file: &env-file
  - path: .env
    required: false

services:
  setup:
    image: alpine:latest
    container_name: songhive-setup
    user: "0:0"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./volumes:/volumes
    command:
      - /bin/sh
      - -c
      - mkdir -p /volumes/data /volumes/db /volumes/redis && chown -R "$${PUID}:$${PGID}" /volumes
    restart: "no"

  songhive:
    image: quay.io/blacklight/songhive
    # Or uncomment the following lines if you want to build the image from the
    # local checkout
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     USER_ID: ${PUID:-1000}
    #     GROUP_ID: ${PGID:-1000}
    container_name: songhive-app
    user: ${PUID:-1000}:${PGID:-1000}
    env_file: *env-file
    environment: &songhive-env
      SONGHIVE_DATABASE__URL: postgresql+asyncpg://songhive:songhive@postgres:5432/songhive
      SONGHIVE_REDIS__URL: redis://redis:6379/0
      SONGHIVE_CELERY__BROKER_URL: redis://redis:6379/1
      SONGHIVE_CELERY__RESULT_BACKEND: redis://redis:6379/2
      SONGHIVE_STORAGE__BACKEND: local
      SONGHIVE_STORAGE__LOCAL_PATH: /data/media
      SONGHIVE_FEDERATION__ENABLED: "true"
      SONGHIVE_FEDERATION__INSTANCE_DOMAIN: ${SONGHIVE_FEDERATION__INSTANCE_DOMAIN:-localhost}
      SONGHIVE_FEDERATION__INSTANCE_NAME: ${SONGHIVE_FEDERATION__INSTANCE_NAME:-Songhive}
      SONGHIVE_FEDERATION__INSTANCE_DESCRIPTION: ${SONGHIVE_FEDERATION__INSTANCE_DESCRIPTION:-A federated music sharing service}
      SONGHIVE_FEDERATION__PRIVATE_KEY_PATH: /data/federation/actor.pem
      SONGHIVE_AUTH__REGISTRATION_MODE: ${SONGHIVE_AUTH__REGISTRATION_MODE:-open}
      SONGHIVE_SERVER__HOST: 0.0.0.0
      SONGHIVE_SERVER__PORT: "8000"
      SONGHIVE_SERVER__CORS_ORIGINS: '["*"]'
      HOME: /home/songhive
    volumes:
      - *config-mount
      - ./volumes/data:/data
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    image: quay.io/blacklight/songhive
    # Or uncomment the following lines if you want to build the image from the
    # local checkout
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     USER_ID: ${PUID:-1000}
    #     GROUP_ID: ${PGID:-1000}
    container_name: songhive-worker
    user: ${PUID:-1000}:${PGID:-1000}
    env_file: *env-file
    environment:
      <<: *songhive-env
    command: celery -A songhive.tasks worker -B -l info -s /data/celerybeat-schedule -Q celery,scrobbles,bulk
    volumes:
      - *config-mount
      - ./volumes/data:/data
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  watcher:
    image: quay.io/blacklight/songhive
    # Or uncomment the following lines if you want to build the image from the
    # local checkout
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     USER_ID: ${PUID:-1000}
    #     GROUP_ID: ${PGID:-1000}
    container_name: songhive-watcher
    user: ${PUID:-1000}:${PGID:-1000}
    env_file: *env-file
    environment:
      <<: *songhive-env
    command: songhive watch-external-libraries
    volumes:
      - *config-mount
      - ./volumes/data:/data
      # Bind the same host mount points used for local external libraries so
      # the watcher sees the same filesystem tree as the app and worker.
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  stream-worker:
    image: quay.io/blacklight/songhive
    # Or uncomment the following lines if you want to build the image from the
    # local checkout
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     USER_ID: ${PUID:-1000}
    #     GROUP_ID: ${PGID:-1000}
    container_name: songhive-stream-worker
    user: ${PUID:-1000}:${PGID:-1000}
    env_file: *env-file
    environment:
      <<: *songhive-env
    command: songhive stream-worker
    volumes:
      - *config-mount
      - ./volumes/data:/data
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    profiles:
      - streams

  nginx:
    image: nginx:stable-alpine
    container_name: songhive-nginx
    ports:
      - "${SONGHIVE_HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - songhive
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: songhive-postgres
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      POSTGRES_USER: songhive
      POSTGRES_PASSWORD: songhive
      POSTGRES_DB: songhive
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: songhive-redis
    user: ${PUID:-1000}:${PGID:-1000}
    volumes:
      - ./volumes/redis:/data
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  default:
    name: songhive
