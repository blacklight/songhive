# --- Federation stampede defenses ----------------------------------------
#
# A boosted post makes hundreds of remote instances dereference the same
# actor/object URLs at once. The edge cache serves repeat fetches without
# touching the application and ``proxy_cache_lock`` folds concurrent misses
# into a single upstream render.
#
# The optional per-IP rate limit (see the federation location below) is
# only safe once nginx resolves the real client address — deployments that
# sit behind a front proxy otherwise throttle all remote instances as one
# bucket keyed on the proxy's address.

# Only dereference reads are throttled. Inbox POSTs must never be
# rate-limited here: Mastodon retries rejected deliveries, which
# amplifies the very burst the limit is meant to dampen. An empty zone
# key is not limited.
map $request_method $songhive_fedread_key {
    GET     $binary_remote_addr;
    HEAD    $binary_remote_addr;
    default "";
}
limit_req_zone $songhive_fedread_key zone=songhive_fedread:10m rate=10r/s;

proxy_cache_path /var/cache/nginx/songhive-fedoc
    levels=1:2 keys_zone=songhive_fedoc:16m max_size=256m inactive=10m
    use_temp_path=off;

# Normalize the dereference content negotiation into the cache key. This
# mirrors the application's content negotiation
# (``_accepts_activitypub``/``_accepts_html`` in
# ``api/routes/profile_pages.py``): only ``activity+json`` and ``ld+json``
# request an AP document (``jrd+json`` does not), and a client accepting
# both AP and HTML is a third variant because routes such as
# ``GET /tracks/{id}`` answer it differently.
# ``*/*`` counts as HTML-capable here, mirroring ``_accepts_html`` —
# ``Accept: application/activity+json, */*`` is answered like
# ``ap+html`` by routes such as ``GET /tracks/{id}`` (SPA instead of 404).
map $http_accept $songhive_accept_class {
    ~*(application/activity\+json|application/ld\+json).*(text/html|\*/\*) "ap+html";
    ~*(text/html|\*/\*).*(application/activity\+json|application/ld\+json) "ap+html";
    ~*(application/activity\+json|application/ld\+json) "ap";
    default "html";
}

# Only anonymous AP-JSON fetches may be served from or stored in the edge
# cache. HTML variants are per-visitor (semantic <head> tags honor the
# logged-in user and share-token credentials), as is any request carrying
# credentials. The exact-match "ap" below requires the AP class AND all
# three credential variables empty.
map "$songhive_accept_class$http_cookie$http_authorization$http_x_share_token" $songhive_no_cache {
    "ap"    0;
    default 1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # Deployment-specific: when a front proxy terminates traffic in front
    # of this nginx, set its CIDR here so $remote_addr — and therefore the
    # federation rate limit and the access log — reflects the real client
    # instead of the proxy. Only then is it safe to enable the limit_req
    # directives in the federation location below.
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Rejected dereference reads return 429 (Retry-After friendly), not
    # the 503 default that remote instances amplify with retries.
    limit_req_status 429;

    # Docker's embedded DNS resolver re-resolves service hostnames when
    # containers are recreated.
    resolver 127.0.0.11 valid=30s;
    set $songhive "http://songhive:8000";

    # Audio streaming: disable buffering to support real-time delivery.
    location /api/v1/stream/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Subsonic API adapter (/rest/*.view). Buffering stays off so
    # stream.view/download.view deliver audio in real time like
    # /api/v1/stream/ above.
    location /rest/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # WebSocket events.
    location /ws/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ActivityPub dereference endpoints: edge-cached with single-flighted
    # misses. GET/HEAD documents are cached briefly (the application emits
    # a matching Cache-Control); non-GET requests (inbox POSTs) are never
    # cached and never rate-limited here.
    #
    # The per-IP read limit below MUST stay disabled until real_ip_* is
    # configured for the front proxy (see the top of this server block) —
    # otherwise every remote instance shares the proxy's bucket.
    location ~ ^/(users/|@|activities/|tracks/|artists/|albums/|libraries/|nodeinfo/|\.well-known/webfinger) {
        # limit_req zone=songhive_fedread burst=20 nodelay;

        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache songhive_fedoc;
        proxy_cache_key "$scheme://$host$request_uri $songhive_accept_class";
        proxy_cache_methods GET HEAD;
        # Cache only anonymous AP-JSON fetches; HTML and credential-bearing
        # requests always reach (and are never stored from) the app.
        proxy_cache_bypass $songhive_no_cache;
        proxy_no_cache $songhive_no_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # The app sends ``Vary: Accept`` on every AP document. The
        # normalized accept class is already part of the cache key, and
        # honoring the raw header would key one variant per distinct
        # remote ``Accept`` string (Mastodon, Misskey, GoToSocial, …)
        # instead of one per class — ignore it. The header still passes
        # through to clients untouched.
        proxy_ignore_headers Vary;
        # Edge freshness policy: the app bounds every cacheable response
        # with ``X-Accel-Expires`` = min(remaining in-process freshness,
        # federation.edge_cache_ttl_seconds), which overrides any upstream
        # Cache-Control here — so a cached document can never outlive the
        # app's freshness policy, and app-side clears (suspension,
        # deletion, retraction) that cannot reach this cache are bounded by
        # federation.edge_cache_ttl_seconds rather than the advertised
        # max-age. ``proxy_cache_valid`` is only the fallback for responses
        # without the header (e.g. 404s) and must match
        # federation.edge_cache_ttl_seconds. Stale serving is deliberately
        # NOT enabled: outage resilience comes from the app's own
        # stale-if-error, and a hard edge staleness bound is worth more
        # than serving expired copies during an app outage.
        proxy_cache_valid 200 15s;
        proxy_cache_valid 404 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Everything else is served by the application itself: the REST API,
    # federation endpoints, the built frontend assets and the SPA shell.
    # Serving the SPA through FastAPI lets the backend inject OpenGraph and
    # other semantic <head> tags into object pages, and perform the
    # browser/ActivityPub content negotiation for routes that double as
    # dereferenceable AP objects.
    location / {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
