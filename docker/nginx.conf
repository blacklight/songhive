# Content negotiation for federation endpoints that may also be served
# by the Vue SPA. ActivityPub/JSON clients are proxied to the backend;
# browser requests (text/html) fall through to the SPA.
map $http_accept $is_browser_request {
    "~*application/(?:activity|ld)\+json" "0";
    "~*text/html"                          "1";
    default                                "0";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;

    # Docker's embedded DNS resolver re-resolves service hostnames when
    # containers are recreated.
    resolver 127.0.0.11 valid=30s;
    set $songhive "http://songhive:8000";
    set $swagger_ui "http://swagger-ui:8080";

    # Audio streaming: disable buffering to support real-time delivery.
    location /api/v1/stream/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # WebSocket events.
    location /ws/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API.
    location /api/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI spec used by swagger-ui.
    location /openapi.json {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # When swagger-ui is served under a base path, the spec may be requested
    # as /swagger-ui/openapi.json (e.g. through a reverse proxy). Rewrite it
    # to /openapi.json before proxying to the application.
    location = /swagger-ui/openapi.json {
        rewrite ^ /openapi.json break;
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Federation routes.
    location /.well-known/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /nodeinfo/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ap/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Per-user ActivityPub actor and related endpoints.
    # Browsers get the Vue SPA; ActivityPub/JSON clients hit the backend.
    location ~ ^/users(?:/|$) {
        if ($is_browser_request = "1") {
            rewrite ^ /index.html last;
        }
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mastodon-style /@username alias.
    # Browsers get the Vue SPA; ActivityPub/JSON clients hit the backend.
    location ~ ^/@[^/]+$ {
        if ($is_browser_request = "1") {
            rewrite ^ /index.html last;
        }
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI.
    location /swagger-ui {
        proxy_pass $swagger_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files and SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
