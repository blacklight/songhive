server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # Docker's embedded DNS resolver re-resolves service hostnames when
    # containers are recreated.
    resolver 127.0.0.11 valid=30s;
    set $songhive "http://songhive:8000";

    # Audio streaming: disable buffering to support real-time delivery.
    location /api/v1/stream/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # WebSocket events.
    location /ws/ {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is served by the application itself: the REST API,
    # federation endpoints, the built frontend assets and the SPA shell.
    # Serving the SPA through FastAPI lets the backend inject OpenGraph and
    # other semantic <head> tags into object pages, and perform the
    # browser/ActivityPub content negotiation for routes that double as
    # dereferenceable AP objects.
    location / {
        proxy_pass $songhive;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
