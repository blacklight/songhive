---
kind: pipeline
type: docker
name: default

steps:

###
### Run tests
###

- name: tests
  image: python:3.12
  commands:
    - pip install -e ".[dev]" 2>/dev/null || pip install -e . -r requirements-dev.txt
    - python -m pytest --cov=songhive --cov-report=term-missing

###
### Lint
###

- name: lint
  image: python:3.12
  commands:
    - pip install flake8 black
    - python -m flake8 songhive tests
    - python -m black --check .

###
### Mirror the current repository state to Github
###

- name: github-mirror
  image: alpine
  environment:
    SSH_PUBKEY:
      from_secret: ssh_pubkey
    SSH_PRIVKEY:
      from_secret: ssh_privkey

  commands:
    - . .drone/github-mirror.sh
