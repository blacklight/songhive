---
kind: pipeline
type: docker
name: default

trigger:
  event:
    exclude:
      - pull_request

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock
  - name: ffmpeg_bin
    temp: {}
  - name: pip_cache
    host:
      # NOTE: Requires /home/drone to exist (or symlinked)
      # and writeable to the Drone server UID
      path: /home/drone/.cache/pip/drone

steps:

###
### Mirror the current repository state to Github
###

- name: github-mirror
  image: alpine
  environment:
    SSH_PUBKEY:
      from_secret: ssh_pubkey
    SSH_PRIVKEY:
      from_secret: ssh_privkey

  when:
    branch:
      - main
    event:
      - push

  commands:
    - . .drone/github-mirror.sh

###
### Lint
###

- name: backend-lint
  image: python:3.12
  volumes:
    - name: pip_cache
      path: /root/.cache/pip
  commands:
    - pip install flake8 black isort mypy
    - python -m flake8 songhive tests
    - python -m black --check .
    - python -m isort songhive tests
    - python -m mypy songhive

  when:
    event:
      - push
    paths:
      include:
        - songhive/**

###
### Build frontend
###

- name: frontend-build
  image: node:20
  commands:
    # Skip lifecycle scripts: esbuild's postinstall rewrites and then
    # immediately spawns its binary, which fails with ETXTBSY on the
    # CI filesystem. The esbuild platform binary is already installed
    # as an optional dependency, so the build works without the script.
    - cd frontend && npm ci --ignore-scripts && npm run build

  when:
    event:
      - push
      - tag
    paths:
      include:
        - songhive/**
        - frontend/**

###
### Prepare a static ffmpeg binary for the test suite
###

- name: prepare-ffmpeg
  image: docker
  privileged: true
  volumes:
    - name: docker_sock
      path: /var/run/docker.sock
    - name: ffmpeg_bin
      path: /opt/ffmpeg

  when:
    event:
      - push
    paths:
      include:
        - songhive/**

  commands:
    - docker rm -f ff 2>/dev/null || true
    - docker create --name ff mwader/static-ffmpeg:9.0.1
    - docker cp ff:/ffmpeg /opt/ffmpeg/ffmpeg
    - docker rm ff
    - chmod +x /opt/ffmpeg/ffmpeg

###
### Run tests
###

- name: backend-tests
  image: python:3.14
  volumes:
    - name: ffmpeg_bin
      path: /opt/ffmpeg
    - name: pip_cache
      path: /root/.cache/pip

  commands:
    - export PATH="/opt/ffmpeg:$PATH"
    - pip install -e . -r requirements-dev.txt
    - python -m pytest -n 4 --cov-report=xml

  when:
    event:
      - push
    paths:
      include:
        - songhive/**

  depends_on:
    - frontend-build
    - prepare-ffmpeg

###
### Frontend Lint
###

- name: frontend-lint
  image: node:20
  commands:
    - cd frontend && npm run lint && ./node_modules/.bin/prettier --check src
  when:
    event:
      - push
    paths:
      include:
        - frontend/**
  depends_on:
    - frontend-build

###
### Frontend tests
###

- name: frontend-tests
  image: node:20
  commands:
    - cd frontend && npm run test
  when:
    event:
      - push
    paths:
      include:
        - frontend/**
  depends_on:
    - frontend-build

###
### Build and publish the Docker image
###

- name: build-image
  image: docker
  privileged: true
  volumes:
    - name: docker_sock
      path: /var/run/docker.sock

  environment:
    REGISTRY_ENDPOINT: quay.io
    IMAGE_NAME: quay.io/blacklight/songhive
    DOCKER_USER:
      from_secret: docker_user
    DOCKER_PASS:
      from_secret: docker_pass

  when:
    event:
      - tag

  commands:
    - . .drone/build-image.sh

###
### Build and publish the PyPI package
###

- name: update-pip-package
  image: alpine
  environment:
    TWINE_USERNAME:
      from_secret: pypi_user
    TWINE_PASSWORD:
      from_secret: pypi_pass

  when:
    event:
      - tag

  depends_on:
    - frontend-build
    - backend-tests

  commands:
    - . .drone/update-pip-package.sh

###
### Upload test coverage to Codacy
###

- name: codacy-coverage
  image: python:3.12
  depends_on:
    - github-mirror
    - backend-tests
  when:
    branch:
      - main
    event:
      - push
    paths:
      include:
        - songhive/**

  environment:
    CODACY_PROJECT_TOKEN:
      from_secret: codacy_project_token
  commands:
    - curl -fsSL https://coverage.codacy.com/get.sh -o /tmp/codacy-coverage.sh
    - bash /tmp/codacy-coverage.sh report -r coverage.xml --commit-uuid "$DRONE_COMMIT_SHA"
